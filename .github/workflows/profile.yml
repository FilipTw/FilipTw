name: Profile artwork

on:
  schedule: # every day, so the Activity numbers stay live
    - cron: "17 4 * * *"
  workflow_dispatch: # run it by hand from the Actions tab
  push:
    branches:
      - main
    paths:
      - "*.py"
      - requirements*.txt
      - pyproject.toml
      - Makefile
      - tests/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache fonts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .fonts
          key: fonts-${{ hashFiles('fontstore.py') }}

      - name: Check # lint, types and tests; a failure stops the daily artwork commit
        run: make check PY=python

      - name: Build artwork and README
        run: python build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "chore(assets): refresh profile artwork"
          git pull --rebase
          git push
