name: Profile artwork

on:
  schedule: # every day, so the Activity numbers stay live
    - cron: "17 4 * * *"
  workflow_dispatch: # run it by hand from the Actions tab
  push:
    branches:
      - main
    paths:
      - build.py
      - requirements.txt
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Cache fonts
        uses: actions/cache@v4
        with:
          path: .fonts
          key: fonts-${{ hashFiles('build.py') }}
          restore-keys: fonts-

      - name: Build artwork and README
        run: python build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "chore(assets): refresh profile artwork"
          git pull --rebase
          git push
