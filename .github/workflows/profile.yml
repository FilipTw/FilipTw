name: Profile artwork

on:
  schedule: # every day, so the Activity numbers stay live
    - cron: "17 4 * * *"
  workflow_dispatch: # run it by hand from the Actions tab
  push:
    branches:
      - main
    paths:
      - "*.py"
      - requirements*.txt
      - pyproject.toml
      - Makefile
      - tests/**
      - .github/workflows/profile.yml

permissions:
  contents: write

concurrency:
  group: profile-artwork
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Cache fonts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .fonts
          key: fonts-${{ hashFiles('fontstore.py') }}

      - name: Check # lint, types and tests; a failure stops the daily artwork commit
        run: make check PY=python

      - name: Build artwork and README
        run: python build.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "chore(assets): refresh profile artwork"
          git pull --rebase
          git push
